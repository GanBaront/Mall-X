server {
    listen 80;
    server_name _;
    client_max_body_size 4m;

    # 移动端 H5 静态资源（uni build，hash 路由）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 统一网关代理：/gateway/xxx -> https://gateway:10010/xxx
    # 发布在宿主 5175 端口，前端 api.js 的 IS_VITE_PROXY 判定直接命中，无需改代码
    location /gateway/ {
        proxy_pass https://mall-gateway:10010/;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 用户上传文件直连业务服务
    location /upload/ {
        proxy_pass http://mall-mgr:10011/upload/;
        proxy_set_header Host $host;
    }
}
