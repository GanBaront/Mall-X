server {
    listen 80;
    server_name _;
    client_max_body_size 4m;

    # PC 管理后台静态资源（vite build，base: './'）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 统一网关代理：/gateway/xxx -> https://gateway:10010/xxx（自签名证书，跳过校验）
    location /gateway/ {
        proxy_pass https://mall-gateway:10010/;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 用户上传文件直连业务服务（头像等 /upload/** 静态资源）
    location /upload/ {
        proxy_pass http://mall-mgr:10011/upload/;
        proxy_set_header Host $host;
    }
}
