name: mall-x

services:
  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: mallx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MALL_DB_PASSWORD:-123456}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      # 宿主机 3306 通常被本地 MySQL 占用，容器库映射到 3307 供 Navicat 等外部访问
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动导入全量数据（含建库语句；要重置数据：docker compose down -v 后重新 up）
      - ./backend/sql/mall-x-full.sql:/docker-entrypoint-initdb.d/01-mallx-init.sql:ro
    healthcheck:
      # 必须走 TCP（127.0.0.1）：初始化导入期间 MySQL 仅开 socket，socket 探活会误报健康
      # $$ 转义后由容器内 shell 展开，避免在 compose 文件里写明文口令
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  # ==================== 业务微服务 ====================
  mall-mgr:
    build:
      context: ./backend
      args:
        MODULE: mall-mgr
    image: mallx/mall-mgr:1.0.0
    container_name: mallx-mgr
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mallDb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "${MALL_DB_PASSWORD:-123456}"
      MALL_JWT_SECRET: "${MALL_JWT_SECRET:-local-demo-jwt-secret-change-me-32bytes}"
      MALL_SIGN_KEY: "${MALL_SIGN_KEY:-local-demo-sign-key-change-me}"
      MALL_ALIPAY_BASE_URL: http://mall-alipay:10012
      MALL_ALIPAY_RETURN_URL: "http://localhost:5175/#/pages/orders/orders"
      MALL_INIT_DEMO_ORDERS: "false"
      JAVA_OPTS: "-Xms256m -Xmx768m"
    volumes:
      # 用户上传文件（头像/商品图）落到宿主机 backend/uploads
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  # ==================== 支付微服务 ====================
  mall-alipay:
    build:
      context: ./backend
      args:
        MODULE: mall-alipay
    image: mallx/mall-alipay:1.0.0
    container_name: mallx-alipay
    environment:
      TZ: Asia/Shanghai
      MALL_CALLBACK_URL: http://mall-mgr:10011/pay/callback
      MALL_SIGN_KEY: "${MALL_SIGN_KEY:-local-demo-sign-key-change-me}"
      # 沙箱凭据只从 .env 注入；留空则使用内置模拟收银台
      ALIPAY_APP_ID: "${ALIPAY_APP_ID:-}"
      ALIPAY_APP_PRIVATE_KEY: "${ALIPAY_APP_PRIVATE_KEY:-}"
      ALIPAY_PUBLIC_KEY: "${ALIPAY_PUBLIC_KEY:-}"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    ports:
      # 模拟收银台 payUrl 写死 http://localhost:10012/mock/cashier，端口必须保持 10012
      - "10012:10012"
    restart: unless-stopped
    depends_on:
      - mall-mgr

  # ==================== 网关（HTTPS 统一入口）====================
  mall-gateway:
    build:
      context: ./backend
      args:
        MODULE: mall-gateway
    image: mallx/mall-gateway:1.0.0
    container_name: mallx-gateway
    environment:
      TZ: Asia/Shanghai
      # 容器网络内路由指向 mall-mgr 服务名（覆盖 yml 里写死的 localhost）。
      # 注意：Spring 按索引合并路由，只传 URI 会顶掉 yml 里同下标的 predicates，必须三元组完整传入
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: mall-mgr
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://mall-mgr:10011
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/**"
      MALL_JWT_SECRET: "${MALL_JWT_SECRET:-local-demo-jwt-secret-change-me-32bytes}"
      MALL_SSL_PASSWORD: "${MALL_SSL_PASSWORD:-MallXGw2026Local}"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    restart: unless-stopped
    ports:
      - "10010:10010"
    depends_on:
      - mall-mgr

  # ==================== PC 管理后台 ====================
  pc-web:
    build:
      context: ./frontend/pc
    image: mallx/pc-web:1.0.0
    container_name: mallx-pc-web
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - mall-gateway

  # ==================== 移动端 H5 ====================
  mobile-h5:
    build:
      context: ./frontend/uniapp/mobile
    image: mallx/mobile-h5:1.0.0
    container_name: mallx-mobile-h5
    ports:
      # 发布在 5175：前端 api.js 按「端口=5175 走 /gateway 代理」自动命中，零代码改动
      - "5175:80"
    restart: unless-stopped
    depends_on:
      - mall-gateway

volumes:
  mysql-data:
